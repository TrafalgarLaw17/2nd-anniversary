<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href='https://fonts.googleapis.com/css?family=Cedarville Cursive' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd Anniversary Invitation</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Dear Vambi,</strong>
                        <pre>
        I invite you to a 2nd anniversary lunch 
        date to be held on September 28, 2025 
        at Kusina Royale followed by activities
        that will make both of us happy.

        Sincerely Yours,
        Babi
                        </pre>
                    </div>
                </div>
            </div>
            <div class="cat">
                <img src="./assets/gatito.png" />
                
            </div>
        </div>
    </div>

    <div id="myModal" class="modal">

    <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
             <iframe width="940" height="500"
                src="./assets/anniversary.mp4"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
